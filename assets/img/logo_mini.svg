<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 72" width="284" height="72" role="img" aria-label="大富翁 · 富贵人生">
  <defs>
    <linearGradient id="mFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset=".3" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#f4b62f"/>
      <stop offset=".78" stop-color="#d98a0c"/>
      <stop offset="1" stop-color="#f1c452"/>
    </linearGradient>
    <linearGradient id="mCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".5" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#b8720c"/>
    </linearGradient>
    <linearGradient id="mSeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9433a"/>
      <stop offset="1" stop-color="#a8231f"/>
    </linearGradient>
  </defs>
  <!-- 金币徽记 -->
  <g transform="translate(4 7)">
    <circle cx="29" cy="29" r="28" fill="#3a2103" opacity=".55" transform="translate(1.5 3)"/>
    <circle cx="29" cy="29" r="28" fill="url(#mCoin)" stroke="#6b4210" stroke-width="2"/>
    <circle cx="29" cy="29" r="21.5" fill="none" stroke="#fff2c4" stroke-width="1.4" opacity=".75"/>
    <circle cx="29" cy="29" r="18" fill="none" stroke="#8a5a12" stroke-width="1.2" opacity=".6"/>
    <text x="29" y="39" text-anchor="middle" font-family="'KaiTi','STKaiti','楷体','Microsoft YaHei',serif" font-weight="700" font-size="26" fill="#5a3407">財</text>
    <path d="M14 14 q15 -11 30 0" fill="none" stroke="#fff" stroke-width="2" opacity=".45" stroke-linecap="round"/>
  </g>
  <!-- 大富翁 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-weight="900" font-size="50" letter-spacing="3" text-rendering="geometricPrecision">
    <text x="72" y="55" fill="#3a2103">大富翁</text>
    <text x="72" y="52" fill="url(#mFill)" stroke="#4a2a04" stroke-width="3.6" stroke-linejoin="round" paint-order="stroke">大富翁</text>
    <text x="72" y="52" fill="none" stroke="#fff3c8" stroke-width=".8" opacity=".7">大富翁</text>
  </g>
  <!-- 小印 富贵 -->
  <g transform="translate(236 8) rotate(-8)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="url(#mSeal)" stroke="#7e1a15" stroke-width="1.4"/>
    <rect x="3.5" y="3.5" width="35" height="35" rx="2" fill="none" stroke="#ffe9d6" stroke-width="1" opacity=".85"/>
    <g font-family="'KaiTi','STKaiti','楷体','Microsoft YaHei',serif" font-weight="700" font-size="17" fill="#fff5ea" text-anchor="middle">
      <text x="21" y="19">富</text>
      <text x="21" y="36">贵</text>
    </g>
  </g>
</svg>
