<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="大富翁 · 富贵人生 WEB 版">
  <defs>
    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset=".22" stop-color="#ffe08a"/>
      <stop offset=".48" stop-color="#f7bd3a"/>
      <stop offset=".62" stop-color="#e0930f"/>
      <stop offset=".82" stop-color="#c47a0a"/>
      <stop offset="1" stop-color="#f1c452"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff0b8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gSeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9433a"/>
      <stop offset="1" stop-color="#a8231f"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="gLineR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#f0a818" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f0a818" stop-opacity="0"/>
    </radialGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="9" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer>
    </filter>
    <filter id="fSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <clipPath id="cGloss"><rect x="0" y="0" width="760" height="112"/></clipPath>
  </defs>

  <!-- 底光 -->
  <ellipse cx="340" cy="120" rx="330" ry="96" fill="url(#gGlow)"/>

  <!-- 星芒点缀 -->
  <g fill="#ffe9a8" opacity=".9">
    <path d="M92 44 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M596 190 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z" opacity=".75"/>
    <circle cx="128" cy="150" r="2.2" opacity=".7"/>
    <circle cx="560" cy="52" r="1.8" opacity=".6"/>
  </g>

  <!-- 主标题：大富翁 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-weight="900" font-size="150" letter-spacing="10" text-anchor="middle" text-rendering="geometricPrecision">
    <!-- 投影 -->
    <text x="340" y="160" fill="#000" filter="url(#fShadow)">大富翁</text>
    <!-- 立体厚度（自下而上叠色） -->
    <text x="340" y="168" fill="#3a2103">大富翁</text>
    <text x="340" y="165" fill="#5a3407">大富翁</text>
    <text x="340" y="162" fill="#7a480a">大富翁</text>
    <!-- 描边 + 金色渐变主体 -->
    <text x="340" y="158" fill="url(#gFill)" stroke="#4a2a04" stroke-width="9" stroke-linejoin="round" paint-order="stroke">大富翁</text>
    <!-- 内侧亮边 -->
    <text x="340" y="158" fill="none" stroke="url(#gRim)" stroke-width="1.6" stroke-linejoin="round">大富翁</text>
    <!-- 顶部高光（上半部分玻璃反光） -->
    <text x="340" y="158" fill="url(#gGloss)" clip-path="url(#cGloss)">大富翁</text>
  </g>

  <!-- 朱红篆印：富贵 -->
  <g transform="translate(618 42) rotate(-9)">
    <rect x="-2" y="-2" width="90" height="90" rx="9" fill="#000" opacity=".28" transform="translate(3 6)"/>
    <rect x="0" y="0" width="86" height="86" rx="8" fill="url(#gSeal)" stroke="#7e1a15" stroke-width="2"/>
    <rect x="7" y="7" width="72" height="72" rx="4" fill="none" stroke="#ffe9d6" stroke-width="1.6" opacity=".9"/>
    <!-- 印面斑驳 -->
    <g fill="#ffffff" opacity=".12">
      <circle cx="12" cy="70" r="3.2"/><circle cx="73" cy="16" r="2.6"/><circle cx="66" cy="74" r="1.8"/>
    </g>
    <g font-family="'KaiTi','STKaiti','楷体','Microsoft YaHei',serif" font-weight="700" font-size="36" fill="#fff5ea" text-anchor="middle">
      <text x="43" y="42">富</text>
      <text x="43" y="75">贵</text>
    </g>
  </g>

  <!-- 副标题 -->
  <g>
    <rect x="130" y="213" width="120" height="1.4" fill="url(#gLine)"/>
    <rect x="510" y="213" width="120" height="1.4" fill="url(#gLineR)"/>
    <path d="M258 213.7 l5 -5 5 5 -5 5z" fill="#ffd76a"/>
    <path d="M492 213.7 l5 -5 5 5 -5 5z" fill="#ffd76a"/>
    <text x="380" y="222" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="23" letter-spacing="11" fill="#efe3bf" font-weight="600">富贵人生<tspan fill="#ffd76a" letter-spacing="4" font-weight="800" dx="8">· WEB 版</tspan></text>
  </g>
</svg>
